# Category weights only. Numeric conformal score is WP6
# (ast-sgrep-gauntlet-remediation-program-1vhy.6). Do not treat present-count
# as a green score.
schema_version = "1"
subject_class = "greenfield-hybrid-search"
min_verification_pct = "unset"
scoring_owned_by = "ast-sgrep-gauntlet-remediation-program-1vhy.6"
matrix = "docs/contracts/supported_surface_matrix.toml"

# Weights must sum to 1.0. Hybrid search indexer, not SQL-class copy-paste.
[category_weight]
search = 0.28
graph = 0.16
index = 0.12
ops = 0.10
machine = 0.12
agent = 0.14
eval = 0.08

[forbidden_victory]
# Surface pillar cannot declare victory if another pillar regresses.
require_all_pillars = true
# Partial never rounds up to present.
partial_is_not_present = true
# Excluded rows are not missing bugs.
excluded_is_not_missing = true
# Latency keep-gate is never a correctness oracle.
latency_only_never_correctness = true
