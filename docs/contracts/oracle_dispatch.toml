# Composite oracle dispatch SSoT (WP4). Human table: docs/validation/oracle-dispatch.md
schema_version = "1"
pass1_q1 = "authoritative_mode per channel is the oracle_id in [[channel]]; latency and UNREPRODUCIBLE ledgers are never_correctness"

[[channel]]
id = "lexical"
scenario = "keyword_fts"
authoritative_mode = "fixture"
subject_id = "asgrep"
oracle_id = "tests/core/parity.rs"
comparator = "must_include_hit_keys"
disc_ids = ["DISC-lexical-not-rg"]
suite_path = "tests/core/parity.rs"
gate_class = "correctness"

[[channel]]
id = "lexical"
scenario = "literal_rg_fixture"
authoritative_mode = "local_pinned"
subject_id = "asgrep"
oracle_id = "ripgrep-15.1.0"
comparator = "indexed_language_file_set_presence"
disc_ids = ["DISC-lexical-not-rg"]
suite_path = "tests/core/literal_diff.rs"
gate_class = "local_correctness"
note = "The 13-language literal file-presence gate runs when ASGREP_DIFF_RG is an absolute ripgrep 15.1.0 path. The registry records Not-run when unset."

[[channel]]
id = "lexical"
scenario = "rg_identity"
authoritative_mode = "excluded"
subject_id = "asgrep"
oracle_id = "rg"
comparator = "hit_id_equality"
disc_ids = ["DISC-lexical-not-rg", "DISC-no-jell-harness"]
suite_path = "docs/validation/jell-deferral.md"
gate_class = "deferred_excluded"

[[channel]]
id = "graph"
scenario = "defs_callers_imports"
authoritative_mode = "fixture"
subject_id = "asgrep"
oracle_id = "tests/core/graph_oracle.rs"
comparator = "expected_edges"
disc_ids = []
suite_path = "tests/core/graph_oracle.rs"
gate_class = "correctness"

[[channel]]
id = "structural-native"
scenario = "pattern_indexed_subset"
authoritative_mode = "spec_fixture"
subject_id = "asgrep"
oracle_id = "docs/structural-patterns.md"
comparator = "supported_shapes_hit"
disc_ids = ["DISC-pattern-native-subset"]
suite_path = "crates/ast-sgrep-lang"
gate_class = "correctness"

[[channel]]
id = "structural-native"
scenario = "ast_grep_cli"
authoritative_mode = "local_pinned"
subject_id = "asgrep"
oracle_id = "ast-grep-cli"
comparator = "match_set_differential"
disc_ids = ["DISC-pattern-native-subset"]
suite_path = "tests/core/pattern_diff.rs"
gate_class = "local_correctness"
note = "Pattern-1 equality runs when ASGREP_DIFF_AST_GREP is an absolute ast-grep 0.45.1 path. The registry records Not-run when unset; native in/out rows always run."

[[channel]]
id = "semantic-ann"
scenario = "math_ivf"
authoritative_mode = "math_spec"
subject_id = "asgrep"
oracle_id = "ast-sgrep-embed math::"
comparator = "unit_math_plus_threshold"
disc_ids = ["DISC-ivf-adaptive-threshold"]
suite_path = "crates/ast-sgrep-embed"
gate_class = "correctness"

[[channel]]
id = "semantic-ann"
scenario = "published_mrr"
authoritative_mode = "ledger"
subject_id = "asgrep"
oracle_id = "benchmarks/results/baselines.md"
comparator = "provenance_only"
disc_ids = ["DISC-baselines-unreproducible"]
suite_path = "benchmarks/results/baselines.md"
gate_class = "never_correctness"

[[channel]]
id = "hybrid-nl"
scenario = "ranking_must_include"
authoritative_mode = "fixture"
subject_id = "asgrep"
oracle_id = "tests/fixtures/ranking/cases.json"
comparator = "must_include_bag"
disc_ids = ["DISC-ranking-soft-oracle", "DISC-casefold-ascii"]
suite_path = "tests/core/ranking_oracle.rs"
gate_class = "correctness"

[[channel]]
id = "hybrid-nl"
scenario = "competitor_bakeoff"
authoritative_mode = "ledger"
subject_id = "asgrep"
oracle_id = "benchmarks/results"
comparator = "none_in_tree"
disc_ids = ["DISC-baselines-unreproducible"]
suite_path = "benchmarks/results"
gate_class = "never_correctness"

[[channel]]
id = "machine-json"
scenario = "cli_envelopes"
authoritative_mode = "fixture_golden"
subject_id = "asgrep"
oracle_id = "tests/cli/machine_contracts.rs"
comparator = "schema_golden_json"
disc_ids = ["DISC-compact-drops-provenance"]
suite_path = "tests/cli/machine_contracts.rs"
gate_class = "correctness"

[[channel]]
id = "machine-json"
scenario = "mcp_protocol"
authoritative_mode = "peer"
subject_id = "asgrep-mcp"
oracle_id = "cli_core_contracts"
comparator = "protocol_shapes"
disc_ids = ["DISC-mcp-not-full-suite"]
suite_path = "tests/mcp"
gate_class = "peer_parity"

[[channel]]
id = "fail-closed"
scenario = "operational_errors"
authoritative_mode = "spec"
subject_id = "asgrep"
oracle_id = "docs/validation/negative-ledgers.md"
comparator = "must_error"
disc_ids = []
suite_path = "docs/validation/negative-ledgers.md"
gate_class = "correctness"

[[channel]]
id = "keep-gate"
scenario = "search_latency"
authoritative_mode = "history"
subject_id = "asgrep bench"
oracle_id = ".bench-history"
comparator = "primary_3_geomean_5_cv_quarantine"
disc_ids = []
suite_path = "scripts/check-bench-output.py"
gate_class = "latency_only"

[[channel]]
id = "forbid-soundness"
scenario = "unsafe_ban"
authoritative_mode = "policy"
subject_id = "workspace"
oracle_id = "scripts/verify-forbid-soundness"
comparator = "exit_0"
disc_ids = []
suite_path = "scripts/verify-forbid-soundness"
gate_class = "correctness"

[[channel]]
id = "jell"
scenario = "cross_engine_hit_ids"
authoritative_mode = "excluded"
subject_id = "asgrep"
oracle_id = "rg+ast-grep"
comparator = "identical_hit_ids"
disc_ids = ["DISC-no-jell-harness"]
suite_path = "docs/validation/jell-deferral.md"
gate_class = "deferred_excluded"
