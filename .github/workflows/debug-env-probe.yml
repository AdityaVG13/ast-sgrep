name: debug-env-probe
# TEMPORARY diagnostic (delete after the publish works). Mints the Actions
# OIDC JWT this pipeline would hand npm and prints ONLY the decoded payload
# claims (identity strings, no credentials) for comparison with the npmjs.com
# trusted-publisher entries. The token itself is never printed.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    # Same protected environment as the publish jobs, so the environment
    # claim is minted exactly as npm would see it.
    environment: npm-production
    runs-on: ubuntu-latest
    steps:
      - run: |
          resp="$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")"
          payload="$(echo "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"].split(".")[1])')"
          echo "$payload" | python3 -c 'import base64,json,sys; d=sys.stdin.read().strip(); print(json.dumps(json.loads(base64.urlsafe_b64decode(d+"="*(-len(d)%4)).decode()), indent=1))'
