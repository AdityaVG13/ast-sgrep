name: Speed benchmark (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speed-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run fixed speed harness
        run: |
          cargo run --locked --release -p ast-sgrep-cli --bin asgrep -- \
            --json --index-path "$RUNNER_TEMP/speed-index.db" \
            bench tests/fixtures/sample --suite default --fixture sample \
            --iterations 10 > speed-results.json
      - name: Enforce correctness and latency threshold
        run: python3 scripts/check-bench-output.py speed-results.json --max-average-ms 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speed-results
          path: speed-results.json
