name: Pi cross-compile smoke test

# Reconciled with snkc macOS-only grouping decision (lruy):
# - macOS: both arches on one macos-14 runner (validated topology)
# - linux/windows: keep native runners in release workflows; do NOT use cargo-xwin here
#   (ring/cc-rs cannot find llvm-lib archiver on ubuntu for win32 cross)
# This smoke workflow validates the macOS grouped build only.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pi-cross-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-build-run:
    name: Grouped macOS build (arm64 native + x64 cross) on one runner
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build both darwin arches on one runner
        env:
          RUSTC_WRAPPER: ""
        run: |
          cargo build --locked --release -p ast-sgrep-cli --bin asgrep --no-default-features --target aarch64-apple-darwin
          cargo build --locked --release -p ast-sgrep-cli --bin asgrep --no-default-features --target x86_64-apple-darwin
      - name: Run arm64 and confirm x64 Mach-O
        run: |
          ./target/aarch64-apple-darwin/release/asgrep version
          ./target/aarch64-apple-darwin/release/asgrep doctor || echo "doctor exit $?"
          file target/x86_64-apple-darwin/release/asgrep
