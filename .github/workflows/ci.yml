name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  forbid-soundness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: verify-forbid-soundness
        run: bash scripts/verify-forbid-soundness

  cargo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check workspace
        run: cargo check --workspace -j1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: tests live under tests/
        run: |
          if grep -R --include='*.rs' -n '#\[test\]' crates/*/src; then
            echo "#[test] must not live in crates/*/src; put tests under tests/" >&2
            exit 1
          fi
          if grep -R --include='*.rs' -n '#\[path =' crates/*/src; then
            echo "#[path] test stubs must not live in crates/*/src; use [[test]] under tests/" >&2
            exit 1
          fi
          if ls -d crates/*/tests 2>/dev/null; then
            echo "crates/*/tests must not exist; use tests/<crate>/" >&2
            exit 1
          fi
          if [ -d tests/unit ]; then
            echo "tests/unit is crate-private wiring; keep intent suites under tests/<crate>/" >&2
            exit 1
          fi
      - name: test workspace
        env:
          # Compare-only. Never set ASGREP_UPDATE_GOLDENS=1 under .github/.
          # SOP: docs/validation/golden-files.md
          ASGREP_UPDATE_GOLDENS: "0"
        run: cargo test --workspace -j1
      - name: upload golden mismatch dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actuals-test
          path: "**/*.actual"
          if-no-files-found: ignore
          retention-days: 7
      - name: no leftover golden actuals
        if: success()
        run: |
          leftovers=$(find . -name '*.actual' ! -path './target/*' ! -path './.git/*' || true)
          if [ -n "$leftovers" ]; then
            echo "unexpected *.actual files (CI is compare-only):" >&2
            echo "$leftovers" >&2
            exit 1
          fi

  pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:pi-dist
      - run: npm test --workspace pi-ast-sgrep
      - run: node --test tests/pi/launcher/*.test.mjs
      - run: npm run check:agent-plugin
      - run: npm run check:pi-contract && npm run check:pi-release

  build-and-test:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --workspace --release

      - name: Test (release)
        env:
          # Compare-only. Never set ASGREP_UPDATE_GOLDENS=1 under .github/.
          # SOP: docs/validation/golden-files.md
          ASGREP_UPDATE_GOLDENS: "0"
        run: cargo test --workspace --release
      - name: upload golden mismatch dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actuals-build-and-test-${{ matrix.os }}
          path: "**/*.actual"
          if-no-files-found: ignore
          retention-days: 7
      - name: no leftover golden actuals
        if: success()
        run: |
          leftovers=$(find . -name '*.actual' ! -path './target/*' ! -path './.git/*' || true)
          if [ -n "$leftovers" ]; then
            echo "unexpected *.actual files (CI is compare-only):" >&2
            echo "$leftovers" >&2
            exit 1
          fi

  windows-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release CLI and MCP
        run: cargo build --release -p ast-sgrep-cli -p ast-sgrep-mcp

      - name: Exercise Windows CLI and cancellation paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo test -p ast-sgrep-cli --lib --release
          $asgrep = (Resolve-Path "target/release/asgrep.exe").Path
          $fixture = Join-Path $env:RUNNER_TEMP "asgrep windows smoke"
          New-Item -ItemType Directory -Force $fixture | Out-Null
          Set-Content -Encoding utf8 (Join-Path $fixture "app.rs") 'fn greet() -> &''static str { "hello" } fn main() { println!("{}", greet()); }'

          & $asgrep --version
          & $asgrep --root $fixture --no-embed --json index
          & $asgrep --root $fixture --no-embed --json status
          & $asgrep --root $fixture --no-embed --json --format native "find greeting implementation"
          & $asgrep --root $fixture --no-embed --json --format native "defs: greet"
          & $asgrep --root $fixture --no-embed --json --format native "callers: greet"
          & $asgrep --root $fixture --no-embed --json doctor

          1..2000 | ForEach-Object {
            Set-Content -Encoding utf8 (Join-Path $fixture "cancel-$_.rs") "fn item_$($_)() -> usize { $($_) }"
          }
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $asgrep
          $startInfo.UseShellExecute = $false
          foreach ($argument in @("--root", $fixture, "--no-embed", "--json", "reindex")) {
            [void]$startInfo.ArgumentList.Add($argument)
          }
          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $startInfo
          if (-not $process.Start()) {
            throw "failed to start asgrep cancellation smoke"
          }
          Start-Sleep -Milliseconds 100
          if ($process.HasExited) {
            throw "asgrep exited before cancellation with code $($process.ExitCode)"
          }
          $process.Kill($true)
          $process.WaitForExit()
          if (-not $process.HasExited) {
            throw "asgrep process survived cancellation"
          }

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --release --all-targets -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        run: cargo audit


      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target

      - name: Cache cargo-fuzz
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.toml') }}

      - name: Install cargo-fuzz
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked

      - name: Sync L1 seed corpora into fuzz corpus
        working-directory: fuzz
        run: bash scripts/sync_seeds.sh

      - name: Fuzz query grammar parser
        working-directory: fuzz
        run: cargo +nightly fuzz run query_grammar -- -max_total_time=30 -timeout=5 -dict=dictionaries/query_grammar.dict

      - name: Fuzz ranking invariants
        working-directory: fuzz
        run: cargo +nightly fuzz run rank -- -max_total_time=30 -timeout=5

