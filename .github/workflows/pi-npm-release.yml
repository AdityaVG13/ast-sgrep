name: Pi npm official release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact existing release tag to publish (for example, v1.2.3)
        required: true
        type: string
      publish:
        description: Confirm publication to npm
        required: true
        type: boolean
        default: false
      bootstrap_token:
        description: One-time first-publication npm token bootstrap; leave off for all subsequent publications
        required: true
        type: boolean
        default: false

concurrency:
  group: pi-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-gate:
    name: Validate immutable signed release
    if: ${{ inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.release_tag }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore annotated signed release tag
        run: git fetch --force origin "refs/tags/${{ inputs.release_tag }}:refs/tags/${{ inputs.release_tag }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install nightly for fuzzing
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - name: Cache cargo-fuzz
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.toml') }}
      - name: Install cargo-fuzz
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked
      - run: npm ci --ignore-scripts
      - name: Configure SSH tag verification
        run: |
          git config --local gpg.format ssh
          git config --local gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/packages/pi/release/allowed-signers"
      - name: Verify contracts and official tag gate
        run: |
          npm run check:pi-contract
          npm run check:pi-release
          node packages/pi/scripts/release-acceptance.mjs gate
      - id: targets
        run: echo "matrix=$(node packages/pi/scripts/release-artifact.mjs matrix)" >> "$GITHUB_OUTPUT"

  build-native:
    name: Build ${{ matrix.package }} once
    needs: release-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-gate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.rustTarget }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: pi-official-${{ matrix.rustTarget }}
      - name: Build target-local release artifacts once
        shell: bash
        env:
          RUSTC_WRAPPER: ""
        run: |
          cargo build --locked --release -p ast-sgrep-cli --bin asgrep --no-default-features --target "${{ matrix.rustTarget }}"
          cargo build --locked --release -p ast-sgrep-codemode-napi --target "${{ matrix.rustTarget }}"
      - name: Preserve native checksum and provenance metadata
        shell: bash
        run: |
          binary="target/${{ matrix.rustTarget }}/release/${{ matrix.executable }}"
          if [ "${{ matrix.os }}" = "win32" ]; then
            napi="target/${{ matrix.rustTarget }}/release/ast_sgrep_codemode_napi.dll"
          elif [ "${{ matrix.os }}" = "darwin" ]; then
            napi="target/${{ matrix.rustTarget }}/release/libast_sgrep_codemode_napi.dylib"
          else
            napi="target/${{ matrix.rustTarget }}/release/libast_sgrep_codemode_napi.so"
          fi
          node packages/pi/scripts/release-artifact.mjs prepare \
            --target "${{ matrix.id }}" \
            --binary "$binary" \
            --napi "$napi" \
            --output "dist/${{ matrix.id }}" \
            --commit "$GITHUB_SHA"
          node packages/pi/scripts/release-artifact.mjs verify --target "${{ matrix.id }}" --input "dist/${{ matrix.id }}"
      - name: Clean-install and execute target-native npm family
        shell: bash
        run: |
          set -euo pipefail
          platform_dir="packages/pi/platforms/${{ matrix.id }}"
          binary="dist/${{ matrix.id }}/${{ matrix.executable }}"
          cp "$binary" "$platform_dir/${{ matrix.executable }}"
          cp "dist/${{ matrix.id }}/${{ matrix.napiAddon }}" "$platform_dir/${{ matrix.napiAddon }}"
          cp "dist/${{ matrix.id }}/SHA256SUMS" "$platform_dir/checksum.sha256"
          if [ "${{ matrix.os }}" != "win32" ]; then chmod 755 "$platform_dir/${{ matrix.executable }}"; fi
          mkdir -p npm-packs
          npm pack "$platform_dir" --pack-destination npm-packs
          npm pack packages/pi/launcher --pack-destination npm-packs
          npm pack packages/pi/extension --pack-destination npm-packs
          version="$(node -p "require('./packages/pi/release-contract.json').canonicalVersion.version")"
          clean="$RUNNER_TEMP/official-pi-native-install"
          mkdir -p "$clean"
          npm install --force --no-audit --no-fund --prefix "$clean"             "$PWD/npm-packs/ast-sgrep-${{ matrix.id }}-$version.tgz"             "$PWD/npm-packs/ast-sgrep-$version.tgz"             "$PWD/npm-packs/pi-ast-sgrep-$version.tgz"
          node packages/pi/scripts/ci-install-smoke.mjs             --launcher "$clean/node_modules/ast-sgrep/bin/asgrep.js"             --install-root "$clean"             --fixture "$RUNNER_TEMP/pi-official-native-fixture"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: dist/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 90

  verify-release:
    name: Pack and verify complete npm family once
    needs: [release-gate, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist/native
      - name: Restore native executable bit stripped by upload-artifact
        run: find dist/native -type f -name asgrep -exec chmod +x {} +
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: pi-e2e-debug
      - name: Build debug CLI required by the packaged e2e
        env:
          RUSTC_WRAPPER: ""
        run: cargo build --locked -p ast-sgrep-cli --bin asgrep
      - name: Pack and verify all seven immutable artifacts
        run: |
          node packages/pi/scripts/release-acceptance.mjs pack --native-root dist/native --output npm-packs --commit "$GITHUB_SHA"
          node packages/pi/scripts/release-acceptance.mjs verify --artifacts npm-packs
          npm run test:pi-e2e
      - name: Attest exact npm tarballs
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: npm-packs/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: pi-npm-${{ github.ref_name }}-${{ github.sha }}
          path: npm-packs/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve immutable tarballs as durable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --verify-tag --draft \
              --title "ast-sgrep ${{ github.ref_name }}" \
              --notes "Attested, immutable npm tarballs and manifest for ${{ github.ref_name }}. To finish or repeat publication without rebuilding, re-run the publish job (it idempotently verifies packages already live)."
            remote="$RUNNER_TEMP/existing-release-assets"
            mkdir -p "$remote"
            upload=()
            for artifact in npm-packs/*.tgz npm-packs/release-manifest.json; do
              name="$(basename "$artifact")"
              if gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
                gh release download "${{ github.ref_name }}" --pattern "$name" --dir "$remote"
                cmp --silent "$artifact" "$remote/$name" || { echo "release asset differs: $name" >&2; exit 1; }
              else
                upload+=("$artifact")
              fi
            done
            if [ "${#upload[@]}" -gt 0 ]; then gh release upload "${{ github.ref_name }}" "${upload[@]}"; fi

  publish:
    name: Protected npm OIDC publication
    needs: verify-release
    runs-on: ubuntu-latest
    environment: npm-production
    env:
      ASGREP_NPM_PROTECTED_ENVIRONMENT: npm-production
      ASGREP_NPM_OWNERSHIP_APPROVED: ${{ secrets.NPM_OWNERSHIP_APPROVED }}
      NODE_AUTH_TOKEN: ${{ inputs.bootstrap_token && secrets.NPM_TOKEN || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --global npm@11
      - name: Download immutable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p npm-packs
          gh release download "${{ github.ref_name }}" --pattern '*.tgz' --pattern release-manifest.json --dir npm-packs
      - name: Re-verify preserved checksums
        run: node packages/pi/scripts/release-acceptance.mjs verify --artifacts npm-packs
      - name: Publish five native packages
        run: node packages/pi/scripts/release-acceptance.mjs publish --artifacts npm-packs --layer native
      - name: Publish launcher after every native package
        run: node packages/pi/scripts/release-acceptance.mjs publish --artifacts npm-packs --layer launcher
      - name: Publish extension after launcher
        run: node packages/pi/scripts/release-acceptance.mjs publish --artifacts npm-packs --layer extension
