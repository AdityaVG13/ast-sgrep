[advisories]
# `paste` is pulled only by optional neural-embed/rerank support through
# fastembed -> tokenizers -> macro_rules_attribute. RUSTSEC-2024-0436 is an
# unmaintained notice, not a vulnerability, and paste has no patched release.
# fastembed 5.17.4 still resolves the same tokenizers/paste path. Recheck when
# tokenizers adopts pastey (or by 2026-11-12), rather than dropping a supported
# embedding backend to silence an informational advisory.
ignore = ["RUSTSEC-2024-0436"]
