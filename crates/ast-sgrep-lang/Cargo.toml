[package]
name = "ast-sgrep-lang"
description = "Polyglot tree-sitter parsers and symbol extractors for ast-sgrep"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["ast", "tree-sitter", "code-search", "polyglot"]
categories = ["development-tools", "parsing"]
documentation = "https://docs.rs/ast-sgrep-lang"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
tree-sitter.workspace = true
tree-sitter-go.workspace = true
tree-sitter-java = "0.23"
tree-sitter-javascript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-ruby = "0.23"
tree-sitter-rust.workspace = true
tree-sitter-typescript = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-php = "0.24"
tree-sitter-dart = "0.2.0"
tree-sitter-moonbit = { git = "https://github.com/moonbitlang/tree-sitter-moonbit", rev = "b63ce9169bcd831157f3b79ef8ff9219d305f9d0" }

[dev-dependencies]
ast-sgrep-testkit = { path = "../ast-sgrep-testkit" }
serde_json.workspace = true

# Integration tests live in the repo-root tests/ tree.
[[test]]
name = "extraction_goldens"
path = "../../tests/lang/extraction_goldens.rs"
[[test]]
name = "pattern"
path = "../../tests/lang/pattern.rs"
[[test]]
name = "candidate_kind_table"
path = "../../tests/lang/candidate_kind_table.rs"
