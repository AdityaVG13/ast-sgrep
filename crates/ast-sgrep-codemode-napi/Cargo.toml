[package]
name = "ast-sgrep-codemode-napi"
description = "Node-API (NAPI) bindings for in-process ast-sgrep Code Mode"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

# Sealed exception: napi-derive generates unsafe FFI glue for Node's C ABI.
# First-party source must remain free of hand-written unsafe blocks; enforced by
# scripts/verify-forbid-soundness.
[lints.rust]
unsafe_code = "allow"

[lib]
crate-type = ["cdylib", "rlib"]
name = "ast_sgrep_codemode_napi"

[dependencies]
ast-sgrep-codemode = { path = "../ast-sgrep-codemode", version = "2.0.0" }
napi = { version = "3", default-features = false, features = ["napi9", "serde-json", "anyhow"] }
napi-derive = "3"
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
tempfile.workspace = true

# Integration tests live in the repo-root tests/ tree.
[[test]]
name = "ffi_bilateral_pass1"
path = "../../tests/codemode/ffi_bilateral_pass1.rs"

[[test]]
name = "ffi_bilateral_pass2"
path = "../../tests/codemode/ffi_bilateral_pass2.rs"

[[test]]
name = "ffi_bilateral_pass3"
path = "../../tests/codemode/ffi_bilateral_pass3.rs"

[[test]]
name = "ffi_bilateral_pass4"
path = "../../tests/codemode/ffi_bilateral_pass4.rs"
