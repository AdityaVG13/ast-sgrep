[package]
name = "ast-sgrep-codemode-napi"
description = "Node-API (NAPI) bindings for in-process ast-sgrep Code Mode"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

# Sealed exception: napi-derive generates unsafe FFI glue for Node's C ABI.
# First-party source must remain free of hand-written unsafe blocks; enforced by
# scripts/verify-forbid-soundness.
[lints.rust]
unsafe_code = "allow"

[lib]
crate-type = ["cdylib", "rlib"]
name = "ast_sgrep_codemode_napi"

[dependencies]
ast-sgrep-codemode = { path = "../ast-sgrep-codemode", version = "2.0.0" }
napi = { version = "3", default-features = false, features = ["napi9", "serde-json", "anyhow"] }
napi-derive = "3"
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
tempfile.workspace = true
ast-sgrep-testkit = { path = "../ast-sgrep-testkit", features = ["codemode"] }

# Integration tests live in the repo-root tests/ tree.
# ffi_shared.rs is a shared-only module (no #[test]), included via #[path].
[[test]]
name = "ffi_surface"
path = "../../tests/codemode/ffi_surface.rs"

[[test]]
name = "ffi_call_now"
path = "../../tests/codemode/ffi_call_now.rs"

[[test]]
name = "ffi_bilateral"
path = "../../tests/codemode/ffi_bilateral.rs"

[[test]]
name = "ffi_js_client"
path = "../../tests/codemode/ffi_js_client.rs"
