[package]
name = "ast-sgrep-codemode"
description = "Code Mode / programmatic tool-calling surface for ast-sgrep"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["code-search", "agent", "codemode", "tool-calling"]
categories = ["development-tools"]
documentation = "https://docs.rs/ast-sgrep-codemode"
publish = true

[lints]
workspace = true

[lib]
name = "ast_sgrep_codemode"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
ast-sgrep-core = { path = "../ast-sgrep-core", version = "2.0.0" }
ast-sgrep-plugins = { path = "../ast-sgrep-plugins", version = "2.0.0" }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
ast-sgrep-testkit = { path = "../ast-sgrep-testkit" }
tempfile.workspace = true

# Integration tests live in the repo-root tests/ tree.
[[test]]
name = "batch"
path = "../../tests/codemode/batch.rs"
[[test]]
name = "catalog"
path = "../../tests/codemode/catalog.rs"
