[package]
name = "ast-sgrep-mmap"
description = "Sealed read-only mmap wrapper (sole hand-written unsafe boundary)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["mmap", "code-search", "readonly"]
categories = ["filesystem"]
documentation = "https://docs.rs/ast-sgrep-mmap"
publish = true

# Intentionally does NOT inherit workspace.lints.unsafe_code = forbid.
# This crate is the documented sealed boundary that wraps memmap2::map.
[lints.rust]
unsafe_code = "allow"

[dependencies]
memmap2.workspace = true
