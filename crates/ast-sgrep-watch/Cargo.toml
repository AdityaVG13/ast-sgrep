[package]
name = "ast-sgrep-watch"
description = "asgrep-watch helper: incremental file-watch index updates (owns the notify link)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "asgrep-watch"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# Exact pin (not caret): this is the F30 versioned contract pin. A CLI
# release must re-verify `src/cli_contract.rs` (contract v1: exactly one
# entry point, `run_watch_process`) before this pin moves. Path wins locally.
ast-sgrep-cli = { path = "../ast-sgrep-cli", version = "=2.7.0" }
ast-sgrep-core.workspace = true
notify.workspace = true
