[package]
name = "ast-sgrep-mcp"
description = "Model Context Protocol server for hierarchical ast-sgrep code retrieval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["mcp", "code-search", "agent"]
categories = ["development-tools"]
publish = true

[lints]
workspace = true

[[bin]]
name = "asgrep-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
ast-sgrep-core = { path = "../ast-sgrep-core", version = "1.4.0" }
ast-sgrep-plugins = { path = "../ast-sgrep-plugins", version = "1.4.0" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
ast-sgrep-testkit = { path = "../ast-sgrep-testkit" }
tempfile.workspace = true

# Integration tests live in the repo-root tests/ tree.
[[test]]
name = "protocol"
path = "../../tests/mcp/protocol.rs"
