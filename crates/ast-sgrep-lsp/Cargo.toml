[package]
name = "ast-sgrep-lsp"
description = "LSP server for ast-sgrep code search and navigation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["lsp", "language-server", "code-search"]
categories = ["development-tools"]
documentation = "https://docs.rs/ast-sgrep-lsp"

[lints]
workspace = true

[[bin]]
name = "asgrep-lsp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
ast-sgrep-core = { path = "../ast-sgrep-core", version = "1.4.0" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
ast-sgrep-testkit = { path = "../ast-sgrep-testkit" }
tempfile.workspace = true

# Integration tests live in the repo-root tests/ tree.
[[test]]
name = "fuzz_oracles"
path = "../../tests/lsp/fuzz_oracles.rs"
[[test]]
name = "lsp"
path = "../../tests/lsp/lsp.rs"
[[test]]
name = "lsp_stdio_e2e"
path = "../../tests/lsp/lsp_stdio_e2e.rs"
