[package]
name = "ast-sgrep-cli"
description = "CLI for ast-sgrep hybrid code search"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["cli", "code-search", "asgrep"]
categories = ["command-line-utilities", "development-tools"]
documentation = "https://docs.rs/ast-sgrep-cli"

[lints]
workspace = true

[features]
default = []
# Real neural embeddings (fastembed/ONNX). Heavy dependency, opt-in: off by
# default in the workspace, enabled with `--features neural-embed`.
neural-embed = ["ast-sgrep-core/neural-embed"]
rerank = ["ast-sgrep-core/rerank"]

[lib]
name = "ast_sgrep_cli"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
ast-sgrep-core = { path = "../ast-sgrep-core", version = "2.0.0" }
ast-sgrep-codemode = { path = "../ast-sgrep-codemode", version = "2.0.0" }
ast-sgrep-plugins = { path = "../ast-sgrep-plugins", version = "2.0.0" }
clap.workspace = true
nix = { version = "0.29", features = ["signal", "process"] }
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
signal-hook = "0.3"
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }
signal-hook = "0.3"

[dev-dependencies]
ast-sgrep-core = { path = "../ast-sgrep-core", version = "2.0.0" }
ast-sgrep-testkit = { path = "../ast-sgrep-testkit", features = ["lsp"] }
serde_json.workspace = true
tempfile.workspace = true

# Integration tests live in the repo-root tests/ tree.
[[test]]
name = "cli_smoke"
path = "../../tests/cli/cli_smoke.rs"
[[test]]
name = "machine_contracts"
path = "../../tests/cli/machine_contracts.rs"
[[test]]
name = "no_embed_hit_key_parity"
path = "../../tests/cli/no_embed_hit_key_parity.rs"
[[test]]
name = "watch_incremental"
path = "../../tests/cli/watch_incremental.rs"
[[test]]
name = "watch_daemon_e2e"
path = "../../tests/cli/watch_daemon_e2e.rs"
