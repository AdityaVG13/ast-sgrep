[package]
name = "ast-sgrep-testkit"
description = "Shared test harness for ast-sgrep integration tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# E17 (mct-e17-testkit-lsp-87kc): default Bill omits testkit→lsp. Enable
# `lsp` only in crates whose tests call sample_backend / lsp_search_hit_keys.
# `codemode` mirrors that gate for the CodeMode session fixtures: testkit→
# codemode (+plugins for OutputFormat) only when a suite opts in.
# `plugins` gates the compact-envelope projectors (hit_path_set): testkit→
# plugins without the codemode session fixtures. Default Bill stays core + lang.
[features]
default = []
lsp = ["dep:ast-sgrep-lsp"]
plugins = ["dep:ast-sgrep-plugins"]
codemode = ["dep:ast-sgrep-codemode", "plugins"]

[dependencies]
ast-sgrep-codemode = { path = "../ast-sgrep-codemode", version = "2.5.1", optional = true }
ast-sgrep-core = { path = "../ast-sgrep-core", version = "2.5.1" }
ast-sgrep-embed = { path = "../ast-sgrep-embed", version = "2.5.1" }
ast-sgrep-lang = { path = "../ast-sgrep-lang", version = "2.5.1" }
ast-sgrep-lsp = { path = "../ast-sgrep-lsp", version = "2.5.1", optional = true }
ast-sgrep-plugins = { path = "../ast-sgrep-plugins", version = "2.5.1", optional = true }
regex.workspace = true
rusqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tree-sitter.workspace = true
tempfile.workspace = true
