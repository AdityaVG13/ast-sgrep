[package]
name = "ast-sgrep-testkit"
description = "Shared test harness for ast-sgrep integration tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# E17 (mct-e17-testkit-lsp-87kc): default Bill omits testkit→lsp. Enable
# `lsp` only in crates whose tests call sample_backend / lsp_search_hit_keys.
[features]
default = []
lsp = ["dep:ast-sgrep-lsp"]

[dependencies]
ast-sgrep-core = { path = "../ast-sgrep-core", version = "2.0.0" }
ast-sgrep-lang = { path = "../ast-sgrep-lang", version = "2.0.0" }
ast-sgrep-lsp = { path = "../ast-sgrep-lsp", version = "2.0.0", optional = true }
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tree-sitter.workspace = true
tempfile.workspace = true
