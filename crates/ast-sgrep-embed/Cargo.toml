[package]
name = "ast-sgrep-embed"
description = "Native static embedding engine for ast-sgrep (trained token table baked into the binary)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["embedding", "code-search", "semantic-search"]
categories = ["development-tools"]
documentation = "https://docs.rs/ast-sgrep-embed"

[lints]
workspace = true

[dependencies]
rayon.workspace = true
simsimd.workspace = true

# Integration tests live in the repo-root tests/ tree.
[[test]]
name = "semantic_unit"
path = "../../tests/embed/semantic_unit.rs"

[[test]]
name = "static_engine"
path = "../../tests/embed/static_engine.rs"
