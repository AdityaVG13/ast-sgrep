[package]
name = "ast-sgrep-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
ast-sgrep-core = { path = "../crates/ast-sgrep-core", default-features = false }
ast-sgrep-lang = { path = "../crates/ast-sgrep-lang" }
ast-sgrep-embed = { path = "../crates/ast-sgrep-embed", default-features = false }
ast-sgrep-lsp = { path = "../crates/ast-sgrep-lsp" }
ast-sgrep-codemode = { path = "../crates/ast-sgrep-codemode" }

[[bin]]
name = "query_grammar"
path = "fuzz_targets/query_grammar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rank"
path = "fuzz_targets/rank.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lang_parse"
path = "fuzz_targets/lang_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "classify_native"
path = "fuzz_targets/classify_native.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ann_clusters"
path = "fuzz_targets/ann_clusters.rs"
test = false
doc = false
bench = false

[[bin]]
name = "embed_roundtrip"
path = "fuzz_targets/embed_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lsp_frame"
path = "fuzz_targets/lsp_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codemode_serve"
path = "fuzz_targets/codemode_serve.rs"
test = false
doc = false
bench = false
