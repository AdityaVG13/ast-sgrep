# Proof-pack and optional extended oracle suites (ghiw.5).
# Commands run from the repository root. Score is Pass / Fail / Not-run only.

[[suite]]
id = "forbid-soundness"
label = "verify-forbid-soundness"
tier = "proof-pack"
command = ["bash", "scripts/verify-forbid-soundness"]

[[suite]]
id = "ranking_oracle"
label = "ast-sgrep-core ranking_oracle"
tier = "proof-pack"
command = ["cargo", "test", "-p", "ast-sgrep-core", "--test", "ranking_oracle", "-j1", "--", "--test-threads=1"]

[[suite]]
id = "graph_oracle"
label = "ast-sgrep-core graph_oracle"
tier = "proof-pack"
command = ["cargo", "test", "-p", "ast-sgrep-core", "--test", "graph_oracle", "-j1", "--", "--test-threads=1"]

[[suite]]
id = "machine_contracts"
label = "ast-sgrep-cli machine_contracts"
tier = "proof-pack"
command = ["cargo", "test", "-p", "ast-sgrep-cli", "--test", "machine_contracts", "-j1", "--", "--test-threads=1", "--skip", "bench_json_emits_cv_pct_and_skips_vacuous_ast_grep_speedup"]

[[suite]]
id = "mcp_protocol"
label = "ast-sgrep-mcp protocol"
tier = "proof-pack"
command = ["cargo", "test", "-p", "ast-sgrep-mcp", "--test", "protocol", "-j1", "--", "--test-threads=1"]

[[suite]]
id = "embed_math"
label = "ast-sgrep-embed math::"
tier = "proof-pack"
command = ["cargo", "test", "-p", "ast-sgrep-embed", "--lib", "math::", "-j1", "--", "--test-threads=1"]

[[suite]]
id = "parity"
label = "ast-sgrep-core parity"
tier = "extended"
command = ["cargo", "test", "-p", "ast-sgrep-core", "--test", "parity", "-j1", "--", "--test-threads=1"]

[[suite]]
id = "extraction_goldens"
label = "ast-sgrep-lang extraction_goldens"
tier = "extended"
command = ["cargo", "test", "-p", "ast-sgrep-lang", "--test", "extraction_goldens", "-j1", "--", "--test-threads=1"]

[[suite]]
id = "semantic_ivf_roundtrip"
label = "ast-sgrep-core semantic_ivf_roundtrip"
tier = "extended"
command = ["cargo", "test", "-p", "ast-sgrep-core", "--test", "semantic_ivf_roundtrip", "-j1", "--", "--test-threads=1"]

[[suite]]
id = "pattern_diff"
label = "ast-sgrep-core pattern_diff"
tier = "extended"
command = ["cargo", "test", "-p", "ast-sgrep-core", "--test", "pattern_diff", "-j1", "--", "--test-threads=1"]
